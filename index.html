<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Kurs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0C1418">
<meta name="description" content="Währungsrechner mit EZB-Referenzkursen.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurs">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&display=swap">
<style>
  :root{
    --bg:#0C1418; --card:#121E23; --card-hi:#18272E; --edge:#1E3037;
    --paper:#F2EFE6; --muted:#6E8189; --ochre:#E9B44C;
    --up:#7FC7A8; --down:#E0705C; --rust:#C87D5A;
    --pad-x:clamp(14px,4.2vw,22px); --row-r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--paper);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-variant-numeric:tabular-nums;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:6px}
  #app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}

  /* ---------- top bar: tabs + status ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:8px var(--pad-x) 10px;flex:none}
  .tabs{
    display:flex;background:var(--card);border-radius:999px;padding:3px;gap:2px;margin:0 auto;
  }
  .tabs button{
    padding:7px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
    color:var(--muted);letter-spacing:.02em;transition:background .16s,color .16s;
  }
  .tabs button[aria-selected="true"]{background:var(--card-hi);color:var(--paper)}
  .status{
    display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;color:var(--muted);
    position:absolute;right:var(--pad-x);
  }
  .topbar{position:relative}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.live{background:var(--up)} .dot.stale{background:var(--rust)}
  .dot.loading{background:var(--ochre);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.2;transform:scale(.75)}}

  .pane{display:none;flex-direction:column;flex:1;min-height:0}
  .pane.on{display:flex}

  /* ---------- shared: flag + code ---------- */
  .flag{
    width:36px;height:36px;flex:none;border-radius:50%;overflow:hidden;
    display:grid;place-items:center;background:var(--card-hi);
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    font-size:26px;line-height:1;
  }
  .flag span{transform:scale(1.55);display:block}
  .flag.sm{width:26px;height:26px;font-size:19px}
  .ident{display:flex;align-items:center;gap:11px;min-width:0}
  .cw{display:flex;align-items:baseline;gap:6px}
  .code{font-size:17px;font-weight:800;letter-spacing:.06em;font-stretch:115%}
  .sym{font-size:12px;color:var(--muted);font-weight:600}
  .chev{color:var(--muted);font-size:11px;margin-left:1px;transform:translateY(1px)}

  /* ---------- pull to refresh ---------- */
  .puller{
    height:0;overflow:hidden;display:grid;place-items:center;
    color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:600;flex:none;
  }
  .puller.snap{transition:height .22s cubic-bezier(.3,.9,.3,1)}

  /* ---------- base card ---------- */
  .base{
    margin:0 var(--pad-x) 12px;padding:14px 16px 15px;background:var(--card);
    border-radius:22px;border:1px solid transparent;flex:none;
    transition:border-color .15s,background .15s;
  }
  .base.drop{border-color:var(--ochre);background:var(--card-hi)}
  .base .lbl{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:600;font-stretch:112%;margin-bottom:9px;
  }
  .base .line{display:flex;align-items:center;gap:10px}
  .base .ident{flex:none}
  #reset{
    flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);
    color:var(--muted);font-size:14px;display:grid;place-items:center;margin-left:auto;
  }
  #reset:active{background:var(--card-hi);color:var(--ochre)}
  #amount{
    flex:1;min-width:0;background:none;border:none;outline:none;text-align:right;
    color:var(--paper);font-family:inherit;font-size:clamp(24px,7.4vw,34px);
    font-weight:700;font-stretch:115%;font-variant-numeric:tabular-nums;padding:0;
    -webkit-user-select:text;user-select:text;
  }

  /* ---------- list ---------- */
  .list{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 var(--pad-x) calc(24px + env(safe-area-inset-bottom));
    touch-action:pan-y;position:relative;
  }
  .list.dragging{overflow:hidden;touch-action:none}
  .item{
    display:flex;align-items:center;gap:12px;background:var(--card);
    border-radius:var(--row-r);padding:13px 16px;margin-bottom:9px;will-change:transform;
  }
  .item.shift{transition:transform .16s cubic-bezier(.3,.9,.3,1)}
  .item.lift{position:relative;z-index:5;background:var(--card-hi);box-shadow:0 14px 30px rgba(0,0,0,.55)}
  .item .nums{margin-left:auto;text-align:right;min-width:0}
  .item .val{font-size:24px;font-weight:700;font-stretch:112%;line-height:1.15}
  .item .sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px;white-space:nowrap}
  .add{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    border:1px dashed var(--edge);border-radius:var(--row-r);padding:15px;
    color:var(--muted);font-size:13.5px;font-weight:600;letter-spacing:.03em;
  }
  .add:active{background:var(--card)}
  .hint{text-align:center;color:var(--muted);font-size:11px;padding:14px 0 4px;line-height:1.5}

  /* ---------- chart pane ---------- */
  .chartwrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 var(--pad-x) calc(10px + env(safe-area-inset-bottom))}
  .pairhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .pairhead .arrow{color:var(--muted);font-size:15px}
  .pairhead .lbl{font-size:13px;font-weight:700;letter-spacing:.05em}
  .bigrate{font-size:clamp(30px,9vw,40px);font-weight:700;font-stretch:115%;line-height:1.15;margin-top:6px}
  .delta{font-size:13.5px;font-weight:700;margin-top:2px}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)}
  .delta .per{color:var(--muted);font-weight:500;margin-left:6px}
  .plot{position:relative;flex:1;min-height:150px;margin-top:12px;touch-action:none}
  .plot svg{width:100%;height:100%;display:block;overflow:visible}
  .readout{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    font-size:11px;color:var(--muted);pointer-events:none;
  }
  .readout b{color:var(--paper);font-weight:700}
  .hilo{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
  .ranges{display:flex;gap:4px;margin-top:12px;background:var(--card);border-radius:999px;padding:3px}
  .ranges button{
    flex:1;padding:8px 0;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);
    transition:background .14s,color .14s;
  }
  .ranges button[aria-selected="true"]{background:var(--card-hi);color:var(--ochre)}
  .cstate{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 10px;line-height:1.6}

  /* ---------- picker sheet ---------- */
  .sheet{
    position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);transform:translateY(100%);
    transition:transform .26s cubic-bezier(.3,.9,.3,1);visibility:hidden;
  }
  .sheet.open{transform:none;visibility:visible}
  .sheet header{display:flex;align-items:center;gap:12px;padding:12px var(--pad-x);border-bottom:1px solid var(--edge)}
  .sheet input{
    flex:1;background:var(--card);border:1px solid var(--edge);border-radius:12px;
    padding:11px 13px;color:var(--paper);font:inherit;font-size:16px;
    -webkit-user-select:text;user-select:text;
  }
  .sheet input::placeholder{color:var(--muted)}
  .sheet .close{color:var(--ochre);font-size:14px;font-weight:700;padding:6px 2px}
  .picklist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px var(--pad-x) 20px}
  .picklist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 6px;border-bottom:1px solid var(--edge)}
  .picklist .n{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
  .picklist button[data-used="1"]{opacity:.42}
  .picklist button[aria-current="true"] .code{color:var(--ochre)}
  .remove{
    margin:16px var(--pad-x) calc(20px + env(safe-area-inset-bottom));padding:15px;
    border-radius:var(--row-r);border:1px solid var(--edge);color:var(--rust);
    font-weight:700;font-size:14px;width:calc(100% - 2*var(--pad-x));
  }
  .remove[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="tabs" role="tablist">
      <button id="tabCalc" role="tab" aria-selected="true">Rechner</button>
      <button id="tabChart" role="tab" aria-selected="false">Verlauf</button>
    </div>
    <span class="status"><span class="dot loading" id="dot"></span><span id="stamp">…</span></span>
  </div>

  <!-- ============ Rechner ============ -->
  <div class="pane on" id="paneCalc">
    <div class="puller" id="puller"><span id="pullTxt">Ziehen zum Aktualisieren</span></div>

    <section class="base" id="base">
      <div class="lbl">Umrechnen</div>
      <div class="line">
        <button class="ident" id="baseIdent">
          <span class="flag" id="baseFlag"><span>🇨🇭</span></span>
          <span class="cw"><span class="code" id="baseCode">CHF</span><span class="sym" id="baseSym">Fr.</span><span class="chev">▾</span></span>
        </button>
        <input id="amount" type="text" inputmode="decimal" enterkeyhint="done"
               autocomplete="off" autocorrect="off" spellcheck="false" value="1">
        <button id="reset" title="Betrag auf 1" aria-label="Betrag auf 1 zurücksetzen">↺</button>
      </div>
    </section>

    <div class="list" id="list"></div>
  </div>

  <!-- ============ Verlauf ============ -->
  <div class="pane" id="paneChart">
    <div class="chartwrap">
      <div id="chartHead"></div>
      <div class="plot" id="plot"></div>
      <div class="hilo" id="hilo"></div>
      <div class="ranges" id="ranges" role="tablist"></div>
    </div>
  </div>
</div>

<section class="sheet" id="sheet" aria-hidden="true">
  <header>
    <input id="search" type="search" placeholder="Währung suchen" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="close" id="closeSheet">Fertig</button>
  </header>
  <div class="picklist" id="picklist"></div>
  <button class="remove" id="removeCur" hidden>Aus Liste entfernen</button>
</section>

<script src="./app.js"></script>
</body>
</html>
