<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Kurs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0C1418">
<meta name="description" content="Währungsrechner mit EZB-Referenzkursen.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurs">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&display=swap">
<style>
  :root{
    --bg:#0C1418;
    --surface:#111E23;
    --edge:#1E3037;
    --paper:#F2EFE6;
    --muted:#6E8189;
    --ochre:#E9B44C;
    --mint:#7FC7A8;
    --rust:#C87D5A;
    --pad-x:clamp(18px,5vw,28px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-variant-numeric:tabular-nums;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:4px}

  #app{
    display:flex;flex-direction:column;height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---- status eyebrow ---- */
  .eyebrow{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px var(--pad-x) 12px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-stretch:112%;font-weight:600;color:var(--muted);
    border-bottom:1px solid var(--edge);
  }
  .status{display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.live{background:var(--mint)}
  .dot.stale{background:var(--rust)}
  .dot.loading{background:var(--ochre);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* ---- the two rows ---- */
  .board{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:0}
  .row{
    padding:min(3.2vh,26px) var(--pad-x);
    display:flex;flex-direction:column;gap:6px;
    transition:opacity .18s ease;
  }
  .row .head{display:flex;align-items:baseline;gap:10px}
  .code{
    font-size:15px;font-weight:800;letter-spacing:.1em;font-stretch:118%;
    padding:3px 0;border-bottom:2px solid transparent;
  }
  .row.on .code{border-bottom-color:var(--ochre)}
  .name{
    font-size:12px;color:var(--muted);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .value{
    font-size:clamp(34px,12.5vw,56px);
    line-height:1.04;font-weight:700;font-stretch:118%;
    word-break:break-all;
  }
  .row.off .value{color:var(--muted);font-weight:600}
  .row.on .value{color:var(--paper)}
  .caret{
    display:inline-block;width:2px;height:.86em;margin-left:3px;
    background:var(--ochre);vertical-align:-.06em;
  }
  .row.on .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .row.off .caret{display:none}

  /* ---- divider with swap ---- */
  .divider{
    display:flex;align-items:center;gap:14px;
    padding:0 var(--pad-x);
  }
  .rule{flex:1;height:1px;background:var(--edge)}
  .swap{
    width:46px;height:46px;flex:none;border-radius:50%;
    border:1px solid var(--edge);background:var(--surface);
    display:grid;place-items:center;font-size:19px;color:var(--ochre);
    transition:transform .28s cubic-bezier(.4,1.4,.5,1);
  }
  .swap:active{transform:rotate(180deg)}
  .rate{
    padding:0 var(--pad-x);margin-top:min(2.4vh,18px);
    font-size:12px;letter-spacing:.05em;color:var(--muted);
    font-stretch:100%;font-weight:500;
  }
  .rate b{color:var(--paper);font-weight:600}

  /* ---- keypad ---- */
  .pad{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--edge);
    background:var(--edge);gap:1px;
    flex:none;
  }
  .pad button{
    background:var(--bg);
    height:min(9.2vh,74px);
    font-size:24px;font-weight:600;font-stretch:110%;
    display:grid;place-items:center;
    transition:background .1s;
  }
  .pad button:active{background:var(--surface)}
  .pad button.util{color:var(--ochre);font-size:19px;font-weight:700}

  /* ---- currency picker ---- */
  .sheet{
    position:fixed;inset:0;background:var(--bg);z-index:20;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
    transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
    visibility:hidden;
  }
  .sheet.open{transform:none;visibility:visible}
  .sheet header{
    display:flex;align-items:center;gap:12px;
    padding:12px var(--pad-x);border-bottom:1px solid var(--edge);
  }
  .sheet input{
    flex:1;background:var(--surface);border:1px solid var(--edge);border-radius:10px;
    padding:11px 13px;color:var(--paper);font:inherit;font-size:16px;
    -webkit-user-select:text;user-select:text;
  }
  .sheet input::placeholder{color:var(--muted)}
  .sheet .close{color:var(--ochre);font-size:14px;font-weight:700;padding:6px 2px}
  .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
  .list button{
    display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
    padding:15px var(--pad-x);border-bottom:1px solid var(--edge);
  }
  .list .c{font-weight:800;font-stretch:118%;letter-spacing:.08em;min-width:52px;font-size:14px}
  .list .n{color:var(--muted);font-size:14px}
  .list button[aria-current="true"] .c{color:var(--ochre)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div id="app">

  <div class="eyebrow">
    <span>EZB-Referenzkurs</span>
    <span class="status"><span class="dot loading" id="dot"></span><span id="stamp">lädt…</span></span>
  </div>

  <main class="board">
    <div class="row on" id="rowFrom">
      <div class="head">
        <button class="code" id="codeFrom">CHF</button>
        <span class="name" id="nameFrom">Schweizer Franken</span>
      </div>
      <div class="value" id="valFrom" role="button" tabindex="0">1<span class="caret"></span></div>
    </div>

    <div class="divider">
      <span class="rule"></span>
      <button class="swap" id="swap" aria-label="Währungen tauschen">⇅</button>
      <span class="rule"></span>
    </div>

    <div class="row off" id="rowTo">
      <div class="head">
        <button class="code" id="codeTo">EUR</button>
        <span class="name" id="nameTo">Euro</span>
      </div>
      <div class="value" id="valTo" role="button" tabindex="0" aria-live="polite">–<span class="caret"></span></div>
    </div>

    <p class="rate" id="rate">&nbsp;</p>
  </main>

  <div class="pad" id="pad">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k=".">.</button><button data-k="0">0</button>
    <button data-k="back" class="util" aria-label="Löschen">⌫</button>
  </div>
</div>

<section class="sheet" id="sheet" aria-hidden="true">
  <header>
    <input id="search" type="search" placeholder="Währung suchen" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="close" id="closeSheet">Fertig</button>
  </header>
  <div class="list" id="list"></div>
</section>

<script src="./app.js"></script>
</body>
</html>
